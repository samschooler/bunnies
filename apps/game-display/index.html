<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Party Game - Display</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #qr-container {
      position: fixed;
      top: 20px;
      right: 20px;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      z-index: 1000;
    }
    #qr-code {
      display: block;
    }
    #room-code {
      text-align: center;
      margin-top: 10px;
      font-size: 24px;
      font-weight: bold;
      color: #333;
      letter-spacing: 3px;
    }
    #player-list {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.7);
      padding: 15px;
      border-radius: 10px;
      color: white;
      z-index: 1000;
      min-width: 200px;
    }
    #player-list h3 {
      margin-bottom: 10px;
      font-size: 18px;
    }
    .player-item {
      display: flex;
      align-items: center;
      margin: 5px 0;
      font-size: 14px;
    }
    .player-color {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      margin-right: 8px;
    }
    .player-disconnected {
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div id="qr-container" style="display: none;">
    <canvas id="qr-code"></canvas>
    <div id="room-code"></div>
  </div>
  <div id="player-list">
    <h3>Players (<span id="player-count">0</span>)</h3>
    <div id="players"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
