<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Party Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 40px;
      max-width: 500px;
      width: 100%;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      font-size: 18px;
      color: #a0a0a0;
      margin-bottom: 40px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    button {
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .create-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .create-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    .join-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #2d2d44;
    }

    .join-input-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    input {
      flex: 1;
      padding: 16px;
      font-size: 18px;
      border: 2px solid #2d2d44;
      border-radius: 12px;
      background: #0f0f1e;
      color: white;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: bold;
    }

    input::placeholder {
      color: #555;
      text-transform: none;
      letter-spacing: normal;
      font-weight: normal;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .join-btn {
      background: #2d2d44;
      color: white;
      padding: 16px 32px;
      white-space: nowrap;
    }

    .join-btn:hover {
      background: #3d3d54;
      transform: translateY(-2px);
    }

    .join-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .error {
      color: #ff6b6b;
      margin-top: 10px;
      font-size: 14px;
    }

    .loading {
      display: none;
      margin-top: 20px;
      color: #667eea;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Party Game</h1>
    <p>Collect coins and upgrade your character!</p>

    <div class="buttons">
      <button class="create-btn" id="createBtn">Create Game</button>

      <div class="join-section">
        <p style="margin-bottom: 15px; font-size: 16px;">or join as a player</p>
        <div class="join-input-group">
          <input
            type="text"
            id="roomCodeInput"
            placeholder="Enter room code"
            maxlength="4"
            pattern="[A-Za-z0-9]{4}"
          />
          <button class="join-btn" id="joinBtn">Join</button>
        </div>
        <div class="error" id="errorMsg"></div>
      </div>
    </div>

    <div class="loading" id="loading">Creating room...</div>
  </div>

  <script type="module" src="/src/landing.ts"></script>
</body>
</html>
